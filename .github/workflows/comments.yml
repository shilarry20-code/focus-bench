# While the app is closed, keep writing Feed comments from the to-do list the app leaves in your sync gist.
# Every 2 hours, plus every 20 minutes in the last two hours before Google's daily reset (midnight Pacific),
# when unused requests would vanish anyway. All the quota rules are in tools/comments.mjs.
name: Overnight comments
on:
  schedule:
    - cron: '7 */2 * * *'
    - cron: '27,47 6,7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency: overnight-comments
jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # the Firebase admin library, for writing comments straight into the shared feed
      - run: npm install --no-save --no-package-lock firebase-admin@13
      - run: node tools/comments.mjs
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          MAX_MIN: '25'
